name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reports-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # The lock file pins the versions the committed outputs were made with,
      # so the reports, CSVs and charts below can be compared byte for byte.
      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      # Rerun every report from the committed snapshot (no network needed).
      # If any committed report, CSV or chart changes, fail and show what changed.
      - name: Regenerate reports and check nothing changed
        run: |
          python -m scripts.profile_source
          python -m scripts.occupation_demand
          python -m scripts.regional_demand
          git status --porcelain
          test -z "$(git status --porcelain)" || { git diff --stat; exit 1; }

      # Unit tests, checks on the snapshot and README figures, and the
      # Streamlit AppTest smoke tests that drive every dashboard filter.
      - name: pytest
        run: pytest -q
